<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140">

  <!-- Hexagone fond semi-transparent -->
  <polygon points="60,12 108,40 108,100 60,128 12,100 12,40"
    fill="#1DB954" fill-opacity="0.12"/>

  <!-- Hexagone contour principal -->
  <polygon points="60,12 108,40 108,100 60,128 12,40"
    fill="none" stroke="#1DB954" stroke-width="3" stroke-linejoin="round"/>

  <!-- Hexagone contour principal corrigé -->
  <polygon points="60,12 108,40 108,100 60,128 12,100 12,40"
    fill="none" stroke="#1DB954" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ondes Spotify à l'intérieur de l'hexagone -->
  <path d="M24 52 Q60 36 96 52" stroke="#1DB954" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M28 70 Q60 56 92 70" stroke="#1DB954" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M34 88 Q60 76 86 88" stroke="#1DB954" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Texte "Spoty" blanc -->
  <text x="126" y="58"
    font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-size="36"
    fill="#ffffff">Spoty</text>

  <!-- Texte "clone" vert -->
  <text x="126" y="96"
    font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-size="36"
    fill="#1DB954">clone</text>

  <!-- Ligne décorative sous le texte -->
  <line x1="126" y1="106" x2="252" y2="106"
    stroke="#1DB954" stroke-width="1.5" opacity="0.35"/>

  <!-- Tagline -->
  <text x="126" y="122"
    font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
    font-weight="400"
    font-size="11"
    fill="#1DB954"
    letter-spacing="3"
    opacity="0.7">MUSIC PLAYER</text>

</svg>
